name: Set up Bun and install dependencies
description: >-
  Installs Bun, restores the Bun install cache, and runs
  `bun install --frozen-lockfile` for the requested workspaces. Requires the
  repo to be checked out first (it's a local action).

inputs:
  bun-version:
    description: Bun version to install (pass the workflow's BUN_VERSION).
    required: true
  root:
    description: Install the backend (repo root) dependencies.
    default: "true"
  web:
    description: Install the web/ dependencies.
    default: "false"

runs:
  using: composite
  steps:
    # oven-sh/setup-bun extracts Bun's release zip with the system `unzip`,
    # which the Playwright container image the e2e jobs run in doesn't ship
    # (and installing it would mean an `apt-get update` — the very step those
    # jobs moved into the container to avoid). So where `unzip` is missing,
    # fetch the same release zip and unpack it with Python's zipfile into
    # ~/.bun/bin; setup-bun then finds a binary of the requested version
    # there and uses it instead of downloading its own. A no-op on the
    # hosted runner, which has `unzip`.
    - name: Pre-install Bun without unzip
      if: runner.os == 'Linux'
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      run: |
        if command -v unzip >/dev/null; then exit 0; fi
        case "$(uname -m)" in
          x86_64) arch=x64 ;;
          aarch64) arch=aarch64 ;;
          *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        tmp="$(mktemp -d)"
        curl -fsSL --retry 4 -o "$tmp/bun.zip" \
          "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-${arch}.zip"
        python3 -m zipfile -e "$tmp/bun.zip" "$tmp"
        mkdir -p "$HOME/.bun/bin"
        install -m 755 "$tmp/bun-linux-${arch}/bun" "$HOME/.bun/bin/bun"
        rm -rf "$tmp"
        "$HOME/.bun/bin/bun" --version

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    # The key names the install set and hashes only that set's lockfiles.
    # actions/cache saves only on an exact-key miss and never overwrites, so
    # when every job shared one key, whichever job finished first after a
    # lockfile change saved the cache — often one that installed only root
    # or only web/ — and every later run hit that incomplete entry exactly,
    # never re-saved, and re-downloaded the missing half (issue #473).
    # Falling back to another set's cache is fine: the install below fills
    # in whatever's missing, and this set's key is then saved complete.
    - name: Cache Bun install cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-root=${{ inputs.root }}-web=${{ inputs.web }}-${{ hashFiles('bun.lock', 'web/bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-root=${{ inputs.root }}-web=${{ inputs.web }}-
          bun-${{ runner.os }}-

    - name: Install backend dependencies
      if: inputs.root == 'true'
      shell: bash
      run: bun install --frozen-lockfile

    - name: Install web dependencies
      if: inputs.web == 'true'
      shell: bash
      run: bun install --frozen-lockfile
      working-directory: web
