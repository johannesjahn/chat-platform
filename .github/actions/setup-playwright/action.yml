name: Set up Playwright
description: >-
  Installs Chromium and its system dependencies for the web/ e2e suite.
  Requires the repo to be checked out and web/'s dependencies installed first
  (see ../setup-bun), since it runs web/'s pinned Playwright.

runs:
  using: composite
  steps:
    # Only the browser binary (Chromium) is cacheable across runs — the
    # system deps below are apt packages on an ephemeral, fresh-each-run
    # runner VM, so there's nothing to persist for those. Keyed on
    # web/bun.lock, which pins the @playwright/test (and thus browser)
    # version, so a version bump naturally busts the cache.
    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

    # The hosted runner image ships third-party apt sources (Google Chrome,
    # Microsoft) that nothing here installs from — every package below comes
    # from the Ubuntu archive. When one of those repos serves a stale or
    # mid-rotation index, `apt-get update` still exits 100 and takes the job
    # down with it (CI run #822 on main: "Hash Sum mismatch" on
    # dl.google.com's Packages.gz failed this job and all three e2e shards).
    # Drop those lists first so an unrelated repo can't break the build; the
    # globs cover both the .list and deb822 .sources spellings, and `-f`
    # keeps this a no-op if a future image ships neither.
    - name: Remove unused third-party apt sources
      shell: bash
      run: sudo rm -fv /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*microsoft*

    # Split from browser install: `playwright install` skips re-downloading
    # a browser already present in the cache above, so only this step's
    # apt-get work runs unconditionally on every run.
    - name: Install Playwright system dependencies
      shell: bash
      run: bunx playwright install-deps chromium
      working-directory: web

    - name: Install Playwright browser
      shell: bash
      run: bunx playwright install chromium
      working-directory: web
