# Values for the community `loki` Helm chart (not vendored into this repo —
# see README.md in this directory for the `helmfile apply` command). Installs
# Loki in single-binary/monolithic mode into the same `observability`
# namespace as vm-stack (values.yaml), closing #123. Deliberately not the
# scalable/distributed deployment mode — overkill for a microk8s-sized
# cluster, same reasoning as vm-stack's `vmsingle` over a `vmcluster`.

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  # Filesystem storage backend on the PVC below (singleBinary.persistence),
  # sized similarly to the Postgres/Redis PVCs in
  # ../chat-platform/values.yaml — no object storage (S3/GCS/MinIO) needed
  # for a single-node deployment.
  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  # Explicit retention rather than relying on chart defaults (unbounded) —
  # logs otherwise grow forever on the PVC below. 14 days, matching a
  # reasonable debugging window; bump alongside singleBinary.persistence.size
  # if this needs to grow.
  limits_config:
    retention_period: 336h

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

sidecar:
  disableX509StrictVerification: true
  # The rules sidecar container ships with no resources of its own —
  # unbounded in the loki pod. It only watches ConfigMaps.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# The chart deploys two memcached StatefulSets by default, sized for a
# multi-node Loki cluster: `chunks-cache` asks for **9830Mi** of memory
# (`-m 8192` plus the chart's 1.2x headroom factor) and `results-cache` for
# another **1229Mi** — as *requests*, not just limits. On a single ~8Gi node
# that is more than the whole machine, so chunks-cache can never be
# scheduled (kubelet rejects it with an `OutOfmemory` pod status) and
# results-cache alone eats ~15% of the node to cache queries nobody is
# running. Both are optional for SingleBinary mode — Loki falls back to its
# in-process caches — so they stay off here, same "overkill for a
# microk8s-sized cluster" reasoning as SingleBinary over
# SimpleScalable/Distributed above. The singleBinary memory request above is
# raised to compensate, since those in-process caches now live in this pod.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# The canary writes synthetic log lines and asserts they come back, as a
# DaemonSet with no resource requests/limits of its own — useful signal, but
# not worth an unbudgeted pod per node here (nothing alerts on it; see #121).
# NOTE: this is a top-level key in chart 7.x. It used to live under
# `monitoring.lokiCanary`, which is why the block further down set it there
# and it kept running anyway.
lokiCanary:
  enabled: false

# Everything below is only relevant to the SimpleScalable/Distributed
# deployment modes — explicitly zeroed out rather than left running
# alongside singleBinary.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# No multi-tenant routing/auth needed in front of a single-binary instance
# on a single-tenant cluster.
gateway:
  enabled: false

# Not part of this pass (see #121) — no ServiceMonitor/PrometheusRule CRDs
# installed, and no separate self-monitoring components to run alongside the
# vm-stack already deployed for metrics. (The canary is disabled via the
# top-level `lokiCanary` key above; chart 7.x also dropped the
# `serviceMonitor`/`selfMonitoring` keys this block used to set, so only the
# two below remain — both already default to false, kept explicit.)
monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false

test:
  enabled: false
