{{- if .Values.pgbouncer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chat-platform.fullname" . }}-pgbouncer
  labels:
    {{- include "chat-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  type: ClusterIP
  selector:
    {{- include "chat-platform.selectorLabels" (dict "Release" .Release "Chart" .Chart "component" "pgbouncer") | nindent 4 }}
  ports:
    - port: 5432
      targetPort: pgbouncer
      name: pgbouncer
{{- end }}
